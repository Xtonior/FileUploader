services:
  minio:
    build: .
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: myadmin
      MINIO_ROOT_PASSWORD: myverysecretpassword
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 myadmin myverysecretpassword;
      mc mb --ignore-existing myminio/s3-storage;
      mc anonymous set public myminio/s3-storage;
      exit 0;
      "
